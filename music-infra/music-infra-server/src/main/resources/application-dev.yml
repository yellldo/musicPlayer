spring:
  datasource:
    url: jdbc:mysql://localhost:13306/music_infra?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver  # mysql 8.x 请用这个
    # ==================== Druid 专用配置 ====================
    type: com.alibaba.druid.pool.DruidDataSource  # 指定使用 Druid 数据源
    druid:
      # 连接池配置
      initial-size: 5                          # 初始化连接数
      min-idle: 5                              # 最小空闲连接数
      max-active: 20                           # 最大连接数
      max-wait: 60000                          # 获取连接的最大等待时间（毫秒）
      # 监控配置
      stat-view-servlet:
        enabled: true                          # 开启监控页面
        url-pattern: /druid/*                  # 访问路径：http://localhost:8080/druid
        login-username: admin                  # 监控页面登录用户名（可选）
        login-password: admin123               # 监控页面登录密码（可选）
        allow: 127.0.0.1                       # 允许访问的 IP（默认允许所有，生产环境建议限制）
        # deny: 192.168.1.100                  # 拒绝访问的 IP（可选）
      filter:
        stat:
          enabled: true                        # 开启 SQL 统计监控
          log-slow-sql: true                   # 开启慢 SQL 记录
          slow-sql-millis: 1000                # 慢 SQL 阈值（单位：毫秒，超过则记录）
        wall:
          enabled: true                        # 开启 SQL 防火墙（防注入等，可选）
        config:
          enabled: true                        # 开启其它扩展功能