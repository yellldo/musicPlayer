spring:
  application:
    name: music-adm-gateway
  main:
    allow-bean-definition-overriding: true
    web-application-type: REACTIVE
  config:
    import:
      - nacos:music-adm-gateway.yml
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: music
      config:
        server-addr: 127.0.0.1:8848
        namespace: music

  data:
    redis:
      host: localhost
      port: 16379
      password: gzzgdnz
      database: 2
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

server:
  servlet:
    context-path: /api
  port: 9099


logging:
  file:
    path: /Users/shenjia/logs/music/music-adm-gateway
    name: ${spring.application.name}
  config: classpath:log4j2-spring.xml

